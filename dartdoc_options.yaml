dartdoc:
  categories:
    base:
      markdown: doc/base.md
    ScopeWidget:
      markdown: doc/scope_widget.md
    ScopeModel:
      markdown: doc/scope_model.md
    ScopeNotifier:
      markdown: doc/scope_notifier.md
    AsyncScope:
      markdown: doc/async_scope.md
    AsyncDataScope:
      markdown: doc/async_data_scope.md
    AsyncControllerScope:
      markdown: doc/async_controller_scope.md
    LiteScope:
      markdown: doc/lite_scope.md
    Scope:
      markdown: doc/full_scope.md
    debug:
      markdown: doc/debug.md
    utils:
      markdown: doc/utils.md
  categoryOrder:
    [
      base,
      ScopeWidget,
      ScopeModel,
      ScopeNotifier,
      AsyncScope,
      AsyncDataScope,
      AsyncControllerScope,
      LiteScope,
      Scope,
      debug,
      utils,
    ]
  # includeExternal: ["bin/unusually_located_library.dart"]
  # nodoc: ["lib/sekret/*.dart"]
  # linkTo:
  #   url: "https://my.dartdocumentationsite.org/dev/%v%"
  showUndocumentedCategories: true
  ignore:
    - ambiguous-doc-reference
  errors:
    - unresolved-doc-reference
  warnings:
    - tool-error
