name: scopo_demo
description: "A demo for scopo"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  bloc: ^9.1.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  # From git until the package is published; then `navigation_node: ^0.1.0`.
  navigation_node:
    git:
      url: https://github.com/vi-k/navigation_node.git
  scopo:
    path: ../..
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  leak_tracker_flutter_testing: ^3.0.8

flutter:
  uses-material-design: true
