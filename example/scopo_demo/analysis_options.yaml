# The package's own strict config, one level up: an example is code the reader
# copies, so it answers to the same rules as `lib/`.
include: ../../analysis_options.yaml

linter:
  rules:
    # Off for an example, the same three `example/minimal` and the example of
    # `navigation_node` switch off: an example app exports no API to document,
    # its one-line widget methods read better as blocks, and a
    # fire-and-forget call is the demo itself rather than a forgotten `await`.
    public_member_api_docs: false
    prefer_expression_function_bodies: false
    discarded_futures: false
    # Back on, against the root config. The package turns it off because its
    # own `*Core` widgets do take a decision in `createState()`; nothing in
    # this demo does, and the demo is where a reader copies from. Keeping the
    # rule is what the 200-line copy of the root config did before it was
    # collapsed to this file, and it is the one rule that copy still enforced
    # differently.
    no_logic_in_create_state: true
