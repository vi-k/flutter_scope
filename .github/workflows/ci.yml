# The gate of `AGENTS.md` §6, run by a machine instead of by a person.
#
# Every step below is one of the commands the regimen requires before a merge,
# in the regimen's order, on the toolchain the package declares as its floor:
# Flutter 3.27.0, which carries Dart 3.6.0. Locally that version comes from
# `fvm`; here the action pins the same number directly, so `flutter` and `dart`
# on the PATH are already the right ones and no `fvm` prefix is needed.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes this run pointless.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.0
          channel: stable
          cache: true

      - name: Toolchain
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      # First, while nothing has written to the tree yet: the dry run counts an
      # uncommitted change as a warning, and one warning is a non-zero exit.
      - name: Publish dry run
        run: dart pub publish --dry-run

      - name: Translations answer their originals
        run: sh docs/ru/check.sh

      - name: Formatting
        run: dart format --set-exit-if-changed lib test

      # Before the root analyze, not after it: `flutter analyze` walks the whole
      # tree, `example/` included, and on a fresh clone those packages are not
      # resolved yet -- 60 errors about a `package:` URI that does not exist.
      # Locally the step passes only because the examples were fetched at some
      # point in the past; the first CI run said so.
      - name: Dependencies of the examples
        run: |
          for example in example/*/; do
            echo "== $example"
            (cd "$example" && flutter pub get)
          done

      - name: Analyze
        run: flutter analyze

      - name: Dartdoc
        run: dart doc --dry-run

      # Tests run with the leak tracker enabled — see
      # `test/flutter_test_config.dart`.
      - name: Tests
        run: flutter test

      # Largely a repeat: the root analyze above already walks `example/`, and
      # it reports each file under the nearest `analysis_options.yaml`, the
      # example's own -- `pubspec.yaml` included, which a probe confirmed. Kept
      # because §6 of the regimen lists these three runs separately, and because
      # they are what a person runs by hand: the step name says which example
      # broke without reading a path.
      - name: Examples, analyzed
        run: |
          for example in example/*/; do
            echo "== $example"
            (cd "$example" && flutter analyze)
          done

      # One of the two has a suite of its own. It is outside the local gate,
      # which is exactly why a machine should run it.
      - name: Examples, tested
        run: |
          for example in example/scopo_demo; do
            echo "== $example"
            (cd "$example" && flutter test)
          done

      # The examples' lockfiles are committed and are supposed to be the ones
      # this toolchain resolves. The `pub get` calls above rewrite them if they
      # are not, and then this step says so.
      - name: Nothing drifted
        run: git diff --exit-code
