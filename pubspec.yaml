name: scopo
description: "A Flutter package for managing scopes and dependency injection
  within the widget tree"
version: 0.10.0
homepage: https://github.com/vi-k/scopo
repository: https://github.com/vi-k/scopo
issue_tracker: https://github.com/vi-k/scopo/issues
topics:
  - state-management
  - dependency-injection
  - scope
  - widgets

environment:
  sdk: ^3.6.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  logger_builder: ^0.6.1

dev_dependencies:
  ansi_escape_codes: ^4.0.1
  fake_async: ^1.3.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  leak_tracker_flutter_testing: ^3.0.8
  meta: ^1.15.0
  test: ^1.24.0
