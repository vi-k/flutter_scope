name: scopo
description: "A Flutter package for managing scopes and dependency injection
  within the widget tree"
version: 0.10.0
homepage: https://github.com/vi-k/scopo
repository: https://github.com/vi-k/scopo
issue_tracker: https://github.com/vi-k/scopo/issues
topics:
  - state-management
  - dependency-injection
  - scope
  - widgets

environment:
  sdk: ^3.2.0
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  logger_builder: ^0.5.0
  meta: ^1.16.0

dev_dependencies:
  ansi_escape_codes: ^3.1.2
  fake_async: ^1.3.2
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  test: ^1.24.0
